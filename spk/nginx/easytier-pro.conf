# Static interface. DSM opens a third-party application window at
# /3rdparty/<package>/index.html, which nginx has no route for by default.
location ^~ /3rdparty/easytier-pro/ {
	alias /var/packages/easytier-pro/target/ui/;

	# DSM turns compression off on the TLS listeners (ssl.compress.conf), which
	# leaves the interface bundle - by far the largest thing this package serves,
	# and the reason a first visit spends seconds on a blank page - sent as-is.
	# These files are static and identical for every visitor, so compressing them
	# carries none of the risk that disabling it on TLS protects against.
	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_vary on;
}

# Local API of the package daemon. The application window calls it through the
# /3rdparty path; /webman/3rdparty stays supported for direct access.
#
# X-Syno-Token is DSM's session token, which the daemon passes on to DSM when it
# has the caller's session validated. X-DSM-Scheme/X-DSM-Port describe the
# listener this request arrived on. The
# daemon needs them to reach the appliance's own Web API on loopback, which is
# where it has the caller's session validated: DSM decides whether a session is
# valid, and its answer depends on being asked through a real DSM listener.
location ^~ /3rdparty/easytier-pro/api/ {
	proxy_pass http://127.0.0.1:15890/api/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Syno-Token $http_x_syno_token;
	proxy_set_header X-DSM-Scheme $scheme;
	proxy_set_header X-DSM-Port $server_port;
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;
}

location ^~ /webman/3rdparty/easytier-pro/api/ {
	proxy_pass http://127.0.0.1:15890/api/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Syno-Token $http_x_syno_token;
	proxy_set_header X-DSM-Scheme $scheme;
	proxy_set_header X-DSM-Port $server_port;
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;
}
